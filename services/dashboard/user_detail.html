<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用者資料 · 心語</title><link rel="stylesheet" href="/dashboard-assets/dashboard.css"><link rel="stylesheet" href="/dashboard-assets/enrollment.css"></head><body><main class="content"><a href="/dashboard#users" class="refresh-btn">← 使用者列表</a><header class="topbar"><div><p class="eyebrow">個人資料與對話分析</p><h1 id="name">載入中…</h1><p id="profile" class="muted"></p></div><span id="status" class="status-badge pending">載入中</span></header><p id="languages" class="notice"></p><div class="actions"><button id="edit-profile" class="primary-btn">編輯資料</button><a id="reenroll" class="refresh-btn">重新登記聲紋</a><button id="toggle-user" class="refresh-btn">停用使用者</button><button id="delete-user" class="danger">刪除使用者</button></div><p id="feedback" role="status"></p><section class="metric-grid"><article class="metric-card"><div><span>對話次數</span><strong id="count">—</strong></div></article><article class="metric-card"><div><span>最近心情</span><strong id="mood">—</strong></div></article><article class="metric-card"><div><span>風險</span><strong id="risk">—</strong></div></article></section><section class="panel"><div class="panel-heading"><div><h2>最近對話</h2><p>只顯示文字摘要，不保存原始音訊</p></div></div><div id="conversations" class="empty-state">載入中…</div></section><section class="panel"><div class="panel-heading"><div><h2>風險事件</h2><p>需人工確認，模型分析不等於醫療診斷</p></div></div><div id="risks" class="empty-state">載入中…</div></section><dialog id="edit-dialog"><form id="edit-form" class="profile-fields"><h2>編輯使用者資料</h2><label>姓名<input name="display_name" required maxlength="80"></label><label>性別<select name="gender"><option>不透露</option><option>女性</option><option>男性</option><option>其他</option></select></label><label>年齡（可留空）<input name="age_at_registration" type="number" min="0" max="120"></label><label>偏好對話語言<select name="preferred_language"><option value="yue-HK">粵語</option><option value="zh-CN">普通話</option><option value="en-US">English</option></select></label><p>更改對話語言不需要重新登記聲紋。</p><p id="edit-error" role="alert"></p><div class="actions"><button class="primary-btn">保存修改</button><button id="edit-cancel" type="button" class="refresh-btn">取消</button></div></form></dialog><dialog id="delete-dialog"><form id="delete-form" class="profile-fields"><h2>刪除使用者</h2><p id="delete-description"></p><p>將永久刪除本機此使用者的聲紋、对話、分析、風險事件與個人記憶，取消未完成登記。裝置保留，解除使用者關聯。既有備份不會自動清除。</p><label>請輸入使用者 ID 確認<input id="delete-confirmation" autocomplete="off" required></label><p id="delete-error" role="alert"></p><div class="actions"><button class="danger">確認刪除</button><button id="delete-cancel" type="button" class="refresh-btn">取消</button></div></form></dialog></main><script src="/dashboard-assets/user_detail.js"></script></body></html>
