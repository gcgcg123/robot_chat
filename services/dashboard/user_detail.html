<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户资料 · 心语</title><link rel="stylesheet" href="/dashboard-assets/dashboard.css?v=20260915-12"><link rel="stylesheet" href="/dashboard-assets/enrollment.css?v=20260915-12"></head><body><main class="content"><a href="/dashboard#users" class="refresh-btn">← 用户列表</a><header class="topbar"><div><p class="eyebrow">个人资料与对话分析</p><h1 id="name">载入中…</h1><p id="profile" class="muted"></p></div><span id="status" class="status-badge pending">载入中</span></header><p id="languages" class="notice"></p><div class="actions"><button id="edit-profile" class="primary-btn">编辑资料</button><a id="reenroll" class="refresh-btn">重新登记声纹</a><button id="toggle-user" class="refresh-btn">停用用户</button><button id="delete-user" class="danger">删除用户</button></div><p id="feedback" role="status"></p><section class="metric-grid"><article class="metric-card"><div><span>对话次数</span><strong id="count">—</strong></div></article><article class="metric-card"><div><span>最近心情</span><strong id="mood">—</strong></div></article><article class="metric-card"><div><span>风险</span><strong id="risk">—</strong></div></article></section><section class="panel"><div class="panel-heading"><div><h2>最近对话</h2><p>只显示文字摘要，不保存原始音频</p></div></div><div id="conversations" class="empty-state">载入中…</div></section><section class="panel"><div class="panel-heading"><div><h2>风险事件</h2><p>需人工确认，模型分析不等于医疗诊断</p></div></div><div id="risks" class="empty-state">载入中…</div></section><dialog id="edit-dialog"><form id="edit-form" class="profile-fields"><h2>编辑用户资料</h2><label>姓名<input name="display_name" required maxlength="80"></label><label>性别<select name="gender"><option>不透露</option><option>女性</option><option>男性</option><option>其他</option></select></label><label>年龄（可留空）<input name="age_at_registration" type="number" min="0" max="120"></label><label>偏好对话语言<select name="preferred_language"><option value="yue-HK">粤语</option><option value="zh-CN">普通话</option><option value="en-US">English</option></select></label><p>更改对话语言不需要重新登记声纹。</p><p id="edit-error" role="alert"></p><div class="actions"><button class="primary-btn">保存修改</button><button id="edit-cancel" type="button" class="refresh-btn">取消</button></div></form></dialog><dialog id="delete-dialog"><form id="delete-form" class="profile-fields"><h2>删除用户</h2><p id="delete-description"></p><p>将永久删除本机此用户的声纹、对话、分析、风险事件与个人记忆，取消未完成登记。设备保留，解除用户关联。既有备份不会自动清除。</p><label>请输入用户 ID 确认<input id="delete-confirmation" autocomplete="off" required></label><p id="delete-error" role="alert"></p><div class="actions"><button class="danger">确认删除</button><button id="delete-cancel" type="button" class="refresh-btn">取消</button></div></form></dialog></main><script src="/dashboard-assets/user_detail.js?v=20260915-12"></script></body></html>
