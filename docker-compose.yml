services:
  dialogue:
    build:
      context: .
      args:
        # Speaker recognition is an optional extra: build with WITH_VOICEPRINT=1 to add
        # it (~730 MB, torch dominates). Without it enrollment answers 503 with the
        # install command, and the placeholder provider is never used implicitly.
        WITH_VOICEPRINT: ${WITH_VOICEPRINT:-0}
    container_name: iotgroup5-dialogue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.docker
    environment:
      IOT_DATA_DIR: /var/lib/iotgroup5
      DATABASE_PATH: /var/lib/iotgroup5/emotional_robot.sqlite3
      ASR_SENSEVOICE_MODEL_PATH: /models/asr/sensevoice-small
      ASR_MODEL_PATH: /models/asr/whisper-large-v3-turbo-ct2
      IOT_EMBEDDING_MODEL_PATH: /models/embedding/bge-small-zh-v1.5
      PROJECT_HOST: 0.0.0.0
      PROJECT_PORT: 8080
    volumes:
      - iotgroup5-data:/var/lib/iotgroup5
      - ./models:/models:ro

volumes:
  iotgroup5-data:
