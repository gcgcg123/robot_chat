name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q services simulator scripts
      # tests/ is deliberately not versioned (see .gitignore), so a checkout of this
      # repository usually has no test tree. Skipping is the correct outcome there;
      # running pytest against a missing path exits 4 and would fail CI.
      - name: Run project tests (skipped when the repository ships no tests)
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "tests")) {
            Write-Host "info: tests/ is not versioned in this repository; skipping pytest."
            exit 0
          }
          python -m pytest tests -q
          exit $LASTEXITCODE
      - name: Run JavaScript regression tests (same guard)
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "tests")) {
            Write-Host "info: tests/ is not versioned in this repository; skipping node tests."
            exit 0
          }
          Get-ChildItem tests -Filter *.cjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check JavaScript syntax
        shell: pwsh
        run: node --check services/dashboard/simulator.js
      - name: Check whitespace
        run: git diff --check
